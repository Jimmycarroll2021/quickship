# Schema for mission/BRIEF.yaml (spec §1 as inferred; every item is an ASSUMPTION).
# Only the keywords implemented by scripts/validate_brief.sh are used.
description: Mission brief
type: object
additionalProperties: false
required: [version, goal, success_criteria, deliverables, budgets, permissions, ambiguity_policy]
properties:
  version:
    type: integer
    const: 1
  goal:
    type: string
    minLength: 1
  success_criteria:
    type: array
    minItems: 1
    items:
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, kind, cmd]
          properties:
            id: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
            kind: {type: string, const: test}
            cmd: {type: string}
            timeout_s: {type: integer, minimum: 1}
        - type: object
          additionalProperties: false
          required: [id, kind, path]
          properties:
            id: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
            kind: {type: string, const: file}
            path: {type: string}
            assert: {type: string}
        - type: object
          additionalProperties: false
          required: [id, kind, rubric]
          properties:
            id: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
            kind: {type: string, const: judge}
            rubric: {type: string}
  deliverables:
    type: array
    minItems: 1
    items: {type: string}
  budgets:
    type: object
    additionalProperties: false
    required: [steps, wall_clock]
    properties:
      steps: {type: integer, minimum: 1}
      wall_clock: {type: string, pattern: "^[0-9]+(s|m|h)$"}
  permissions:
    type: object
    additionalProperties: false
    required: [write, network, push]
    properties:
      write:
        type: array
        items: {type: string}
      network: {type: boolean}
      push: {type: string, enum: [none, feature_branch]}
  ambiguity_policy:
    type: string
    enum: [assume_and_log]
  reporting:
    type: object
    additionalProperties: false
    properties:
      estimate_only:
        type: object
        additionalProperties: false
        properties:
          tokens: {type: [integer, "null"]}
          cost_usd: {type: [number, "null"]}
