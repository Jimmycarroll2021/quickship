name: tests

on:
  push:
  pull_request:

jobs:
  self-tests:
    name: self-tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the harness self-tests
        shell: bash
        env:
          QS_PYTHON: python
          QS_TEST_JOBS: "2"
          PYTHONUTF8: "1"
        run: bash scripts/gate.sh
