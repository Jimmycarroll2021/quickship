name: tests

on:
  push:
  pull_request:

jobs:
  self-tests:
    name: self-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the harness self-tests
        shell: bash
        env:
          QS_PYTHON: python
        run: bash tests/run.sh
