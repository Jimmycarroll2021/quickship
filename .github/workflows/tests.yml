name: tests

on:
  push:
  pull_request:

jobs:
  self-tests:
    name: self-tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the harness self-tests
        shell: bash
        env:
          QS_PYTHON: python
          QS_TEST_JOBS: "2"
          PYTHONUTF8: "1"
        run: bash scripts/gate.sh

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to pass
        shell: bash
        run: |
          if [ "${{ needs.self-tests.result }}" != "success" ]; then
            echo "self-tests result: ${{ needs.self-tests.result }}"
            exit 1
          fi
          echo "all self-tests passed"
